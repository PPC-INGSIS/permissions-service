spring.application.name=permissions

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5434}/${POSTGRES_DB:permissions}
spring.datasource.username=${POSTGRES_USER:permissions}
spring.datasource.password=${POSTGRES_PASSWORD:permissions}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
