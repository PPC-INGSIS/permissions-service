spring.application.name=permissions

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5434}/${POSTGRES_DB:permissions}
spring.datasource.username=${POSTGRES_USER:permissions}
spring.datasource.password=${POSTGRES_PASSWORD:permissions}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Auth0: quién emite los tokens (iss) y para qué API son (aud).
# Sin valores por defecto: si faltan, el servicio no arranca.
# El iss de Auth0 es "https://<dominio>/", con la barra final: Spring lo compara como texto exacto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

# Logs en JSON a stdout. El formato ECS ya incluye lo que haya en el MDC, asi que el
# trace.id que pone TraceContextFilter sale en cada linea sin escribirlo a mano.
# No hay service.environment: stack.yml usa ENTORNO para armar el nombre de la app en
# New Relic, pero no la pasa adentro del contenedor, asi que diria "local" en dev y en
# prod. En New Relic los ambientes ya se separan por app_name (permissions-dev).
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.structured.ecs.service.name=permissions
